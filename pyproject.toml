[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-spacetime-lab"
version = "0.1.0"
description = "Research simulations for causal-order spacetime reconstruction experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  # np.trapezoid is a NumPy 2.0 API and the library core has used it
  # since before P12 (conformal.py, measure_sprinkling.py), so the
  # declared floor was already below what the package needs; a
  # 1.26 install fails at import, not at some rare branch.
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]
experiments = [
  "numba>=0.59",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: production-scale regression tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
